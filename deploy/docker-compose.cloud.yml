# 华为云部署用编排：数据与缓存走托管 RDS / DCS，ECS 上只跑应用
# 用法：docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/.env.cloud up -d
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stroke-qc:cloud
    container_name: stroke_app
    restart: unless-stopped
    env_file:
      - .env.cloud
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
