[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "efo"
version = "0.1.0"
description = "Event Fidelity Optimization (EFO): measure and calibrate the event-level correctness of frame-confirmation detection pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "stroke-qc team" }]
keywords = ["event-detection", "quantization", "evaluation", "object-detection", "quality-control", "temporal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["efo"]

[tool.setuptools.package-data]
efo = ["py.typed"]
